server:
  port: ${APP_SERVER_PORT:6084}

spring:
  application:
    name: ${APP_NAME:app}
  data:
    redis:
      host: ${REDIS_HOST:base-redis}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude: com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
## Mybatis Mate 配置
mybatis-mate:
  cert:
    grant: MM20231007001
    license: 
  sharding:
    primary: his
    datasource:
      his:
        - key: his1
          driver-class-name: oracle.jdbc.driver.OracleDriver
          schema: ${HIS_DB_SCHEMA:bshis}
          url: jdbc:oracle:thin:@//${HIS_DB_HOST:192.168.5.7}:${HIS_DB_PORT:1521}/${HIS_DB_SERVER_NAME:orcl}
          username: ${HIS_DB_USER:bshis}
          password: ${HIS_DB_PASSWORD:bsoft}
          test-query: select 1 from dual
          hikari:
            maxLifetime: 1765000
            maximumPoolSize: 10
            minimum-idle: 3
logging:
  level:
    #com.xxl.job: trace


